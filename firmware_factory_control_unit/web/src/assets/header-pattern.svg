<svg width="220" height="64" viewBox="0 0 220 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Harmonischer, kachelbarer Hintergrund fuer den (hellen) Dashboard-Header -- greift die
       Formsprache des Logos auf (IC-Pins, Roboterarm-Gelenke, Foerderband-Linie) in denselben
       Markenfarben (Navy/Orange/Teal), aber stark aufgehellt/transparent, damit Logo und
       Menuetext gut lesbar bleiben. Feste Pixelmasse (kein width/height=100%) sind Absicht: als
       CSS-background-image verwendet, bestimmen sie die Kachelgroesse fuer background-repeat.-->
  <line x1="0" y1="8" x2="220" y2="8" stroke="#16344a" stroke-width="1" opacity="0.08"/>
  <line x1="0" y1="56" x2="220" y2="56" stroke="#16344a" stroke-width="1" opacity="0.08"/>

  <line x1="-10" y1="70" x2="50" y2="-6" stroke="#16344a" stroke-width="1.5" opacity="0.06"/>
  <line x1="60" y1="70" x2="120" y2="-6" stroke="#16344a" stroke-width="1.5" opacity="0.06"/>
  <line x1="130" y1="70" x2="190" y2="-6" stroke="#16344a" stroke-width="1.5" opacity="0.06"/>

  <rect x="14" y="3" width="14" height="4" rx="2" fill="#e8734a" opacity="0.35"/>
  <rect x="74" y="3" width="14" height="4" rx="2" fill="#e8734a" opacity="0.35"/>
  <rect x="134" y="3" width="14" height="4" rx="2" fill="#e8734a" opacity="0.35"/>
  <rect x="194" y="3" width="14" height="4" rx="2" fill="#e8734a" opacity="0.35"/>

  <rect x="14" y="57" width="14" height="4" rx="2" fill="#e8734a" opacity="0.25"/>
  <rect x="74" y="57" width="14" height="4" rx="2" fill="#e8734a" opacity="0.25"/>
  <rect x="134" y="57" width="14" height="4" rx="2" fill="#e8734a" opacity="0.25"/>
  <rect x="194" y="57" width="14" height="4" rx="2" fill="#e8734a" opacity="0.25"/>

  <circle cx="45" cy="32" r="3" fill="none" stroke="#4fd1c5" stroke-width="2" opacity="0.4"/>
  <circle cx="110" cy="32" r="3" fill="none" stroke="#4fd1c5" stroke-width="2" opacity="0.4"/>
  <circle cx="175" cy="32" r="3" fill="none" stroke="#4fd1c5" stroke-width="2" opacity="0.4"/>
</svg>
